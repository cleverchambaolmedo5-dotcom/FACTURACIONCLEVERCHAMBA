services:
  postgres:
    image: postgres:16-alpine
    container_name: facturacion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturacion_cleverchamba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facturacion_cleverchamba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
